services:
  app:        # FastAPI + 前端静态文件（单容器）
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/app/data          # Parquet 数据湖（挂载，不入镜像）
      - ./config:/app/config      # 配置（含 llm.yaml 等，不入库）
      - ./.env:/app/.env:ro       # 密钥文件（不入库）
    environment:
      # LLM Key 推荐登录后在前端「Key 管理」页配置（存数据库，每用户私有）
      # 以下为系统级公共兜底池（可选）
      - LLM_KEY_1=${LLM_KEY_1:-}
      - LLM_KEY_2=${LLM_KEY_2:-}
      - LLM_KEY_3=${LLM_KEY_3:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ENABLE_SCHEDULER=1        # 容器内启用每日定时数据更新

  caddy:      # 反向代理 + 自动 HTTPS（Let's Encrypt 零配置）
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
