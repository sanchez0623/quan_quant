name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · pytest + ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: 单元测试
        env:
          PYTHONUNBUFFERED: "1"
        # --timeout 是挂死护栏（本地全套约 70s；单测内部最长的任务等待上限 600s，
        # 故 900s 只会命中真正的死锁/挂起，触发时 pytest-timeout 会打印全线程栈定位）
        run: python -m pytest tests -v --timeout=900 --timeout-method=thread
        # 说明：CI 不装 requirements-sources（baostock/akshare/mootdx）——
        # 测试用例对「无数据源环境」有专门分支，且也避免了 mootdx 把 httpx 降级。
      - name: ruff 静态检查
        working-directory: .
        run: python -m ruff check .

  frontend:
    name: 前端 · tsc --noEmit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查
        run: npx tsc --noEmit
