# LLM 配置模板（入库，不含密钥）
# 密钥一律通过环境变量注入（api_key_env 指向 .env 中的变量名）
# 实际部署：复制本目录为 config/ 并按需修改，config/ 不入库
#
# 多 API Key 无缝切换：无需改本文件，在 .env 中依次追加即可——
#   DEEPSEEK_API_KEY=key1
#   DEEPSEEK_API_KEY_2=key2
#   DEEPSEEK_API_KEY_3=key3
# 一个 key 余额不足(402)/失效(401)/限流(429)时自动切换下一个（支持 _2~_9 共9个）
# 也可用 api_key_envs 显式声明任意环境变量名列表

profiles:
  main:            # 默认分析模型：DeepSeek V4 Flash（快且便宜）
    provider: openai_compatible
    base_url: https://api.deepseek.com
    model: deepseek-v4-flash
    api_key_env: DEEPSEEK_API_KEY

  deepseek_pro:    # 深度分析可选：DeepSeek V4 Pro（更强但更贵）
    provider: openai_compatible
    base_url: https://api.deepseek.com
    model: deepseek-v4-pro
    api_key_env: DEEPSEEK_API_KEY

  zhipu:           # 智谱 GLM 备选
    provider: openai_compatible
    base_url: https://open.bigmodel.cn/api/paas/v4
    model: glm-4-flash
    api_key_env: ZHIPU_API_KEY

  cheap:           # 轻量任务（分类/摘要），Ollama 本地零成本
    provider: openai_compatible
    base_url: http://localhost:11434/v1
    model: qwen2.5:7b
    api_key_env: OLLAMA_API_KEY

default: main
fallback_chain: [main, deepseek_pro, zhipu, cheap]   # key 全失效时换 profile
